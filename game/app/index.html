<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>恶雌模拟器</title>
<style>
  :root {
    --bg: #f4ede1;
    --paper: #fbf7ef;
    --ink: #3b2f25;
    --muted: #8a7a68;
    --line: #e2d6c3;
    --me: #8c3b2e;
    --me-ink: #fff8f0;
    --c-cl: #b8860b;   /* 苍冽 金 */
    --c-xj: #3a4a8c;   /* 玄烬 墨蓝 */
    --c-mq: #2f5d4a;   /* 墨清寒 墨绿 */
    --c-cy: #6f8394;   /* 楚月白 银 */
    --c-qs: #2f8a96;   /* 栖朔 星青 */
    --c-fj: #b3363a;   /* 焚寂 赤红 */
    --c-nl: #1c7fae;   /* 南黎辰 碧海蓝 */
    --c-ym: #a8841f;   /* 夜墨渊 暗金 */
    --c-gy: #8e63c7;   /* 顾宴礼 紫 */
    --c-lj: #1f4fb8;   /* 蓝槿初 孔雀蓝 */
    --c-rt: #5e9c8f;   /* 容听澜 冰翡 */
    --c-lr: #d14d7b;   /* 鳞峦 */
    --c-jx: #c46a1c;   /* 君玄 */
    --c-cj: #1f9d55;   /* 长珏 */
    --c-wj: #6b7a1f;   /* 无咎 */
    --c-mj: #9a3c9e;   /* 明镜 */
    --c-fq: #5b54c9;   /* 方清然 */
    --c-cx: #ec6a4c;   /* 灿星 */
    --c-other: #7a4a8c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1814; --paper: #26201b; --ink: #ece2d4; --muted: #a3927e; --line: #3a3129;
      --me: #9e4a3a; --me-ink: #fff3ea;
      --c-cl: #e0b44a; --c-xj: #8fa2e8; --c-mq: #74b897; --c-cy: #d3dce4; --c-qs: #8ed6df; --c-fj: #f08a7a; --c-nl: #7cc4ea; --c-ym: #e6c45a; --c-gy: #c9aef0; --c-lj: #8fb4ff; --c-rt: #a3dccf; --c-lr: #f28fb2; --c-jx: #f0a35e; --c-cj: #62d690; --c-wj: #bccb5c; --c-mj: #d98ddb; --c-fq: #a6a0f2; --c-cx: #ff9f8a; --c-other: #c39ad6;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.75 "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--paper);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: 4px; font-family: "STKaiti", "KaiTi", serif; }
  .tabs { display: flex; gap: 4px; flex: 1; }
  .tab { border-radius: 8px; border-color: transparent; background: none; }
  .tab.on { background: var(--bg); border-color: var(--line); font-weight: 700; }
  .view { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .view.on { display: flex; }
  .scroll { flex: 1; overflow-y: auto; padding: 20px 16px 8px; }
  .wrap { max-width: 760px; margin: 0 auto; }

  /* 聊天 */
  .msg { margin: 0 0 18px; }
  .me { display: flex; justify-content: flex-end; }
  .me .bubble {
    background: var(--me); color: var(--me-ink); padding: 8px 14px; border-radius: 14px 14px 4px 14px;
    max-width: 80%; white-space: pre-wrap; word-break: break-word;
  }
  .bubble img, .entry img { display: block; max-width: 260px; max-height: 260px; border-radius: 8px; margin: 6px 0; cursor: zoom-in; }
  .filechip {
    display: inline-block; padding: 2px 10px; margin: 4px 0; border-radius: 6px;
    background: rgba(0,0,0,.12); color: inherit; text-decoration: none; font-size: 14px;
  }
  .ai { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
  .para { margin: 6px 0; }
  .speaker { display: flex; gap: 10px; margin: 12px 0; }
  .who { flex: none; width: 134px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .av {
    width: 128px; height: 128px; border-radius: 12px; border: 3px solid var(--c); flex: none; font-size: 40px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
    background: var(--bg) no-repeat; display: flex; align-items: center; justify-content: center;
    color: var(--c); font-weight: 700; font-family: "STKaiti", "KaiTi", serif;
  }
  .speaker .name { font-weight: 700; font-family: "STKaiti", "KaiTi", serif; font-size: 18px; color: var(--c); }
  .speaker { gap: 16px; }  .speaker .text { border-left: 3px solid var(--c); padding-left: 10px; }

  /* 兽夫栏 */
  #view-chat.on { flex-direction: row; }
  .chatcol { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #cast {
    width: clamp(320px, 32vw, 600px); flex: none; padding: 14px; border-left: 1px solid var(--line);
    background: var(--paper); display: flex; flex-direction: column; gap: 12px; min-height: 0;
  }
  /* 兽夫多了以后：小图一行 4 个，区域可以上下滚动，不挤掉上面的大立绘 */
  #thumbs { display: flex; flex-wrap: wrap; gap: 8px; flex: 0 1 auto; min-height: 96px; overflow-y: auto; align-content: flex-start; padding: 2px; }
  #thumbs .card { flex: 0 0 calc((100% - 24px) / 4); aspect-ratio: 1 / 1; cursor: pointer; }
  #thumbs .card .info { padding: 18px 8px 6px; }
  #thumbs .card .nm { font-size: 14px; }
  #thumbs .card .lv, #thumbs .card .go, #thumbs .card .doing { display: none; }
  .card {
    position: relative; border-radius: 12px; overflow: hidden; cursor: zoom-in;
    border: 1px solid var(--line); background: #fff no-repeat 50% 6% / 230% auto;
    transition: box-shadow .3s, border-color .3s;
  }
  /* 大立绘：图片按高度铺满，人物居中 */
  #stage { flex: 1 0 auto; min-height: 52vh; background-size: auto 100%; background-position: 50% 0; }
  #stage .info { padding: 40px 16px 14px; font-size: 14px; }
  #stage .nm { font-size: 28px; }
  /* 大立绘上的字只留两行，不挡人；鼠标停上去能看全文 */
  #stage .doing { opacity: .85; margin-top: 2px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  #stage .food { display: none; }
  #stage .body .hv { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.3); vertical-align: middle; overflow: hidden; }
  #stage .body .hv i { display: block; height: 100%; }
  #stage .body { opacity: .85; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mefood {
    flex: none; font-size: 13px; line-height: 1.6; padding: 8px 12px; border-radius: 10px;
    background: var(--bg); border: 1px solid var(--line);
  }
  #mefood b { color: var(--me); }
  /* 小地图：谁在哪 */
  #minimap { flex: none; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 6px 8px 8px; cursor: zoom-in; }
  #minimap .mhead { font-size: 13px; display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  #minimap .mhead b { color: var(--me); }
  /* 小地图 = 院子（有资产的地图）：家具 + Q 版小人 */
  #minimap .yardbox { position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; background: #3b4a2f url(/game/%E7%AB%8B%E7%BB%98/2D/%E9%99%A2%E5%AD%90.png) center/100% 100% no-repeat; }
  #minimap .yardbox .fu { position: absolute; transform: translate(-50%,-100%); pointer-events: none; }
  #minimap .yardbox .fu.flip { transform: translate(-50%,-100%) scaleX(-1); }
  #minimap .yardbox .kid { position: absolute; width: 9%; transform: translate(-50%,-100%); transform-origin: 50% 100%; animation: ykid 2.2s ease-in-out infinite; }
  #minimap .yardbox .kid .dot { width: 100%; aspect-ratio: 1/1; border-radius: 50%; background: var(--me); color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  @keyframes ykid { 0%,100% { transform: translate(-50%,-100%) scale(1,1); } 50% { transform: translate(-50%,-100%) scale(1.05,.95); } }
  #minimap .yardbox.cave { background-image: url(/game/%E7%AB%8B%E7%BB%98/2D/%E5%B1%B1%E6%B4%9E%E5%B1%8B%E5%AD%90.png); background-color: #3b2f25; }
  #minimap .yardbox .backyard { position: absolute; left: 6px; top: 6px; padding: 2px 10px; font-size: 12px; background: rgba(255,250,240,.9); z-index: 2; }
  #minimap .yardbox[data-scene="yard"] { cursor: pointer; }
  #minimap .mout { font-size: 12px; margin-top: 4px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #minimap .mlog { font-size: 12px; opacity: .75; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mapbox { position: relative; width: 100%; aspect-ratio: 2 / 1; border-radius: 8px; overflow: hidden; background: #eef1e6; }
  .mapbox svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mapbox .pin { position: absolute; transform: translate(-50%, -50%); display: flex; gap: 2px; z-index: 1; }
  .mapbox .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--c); background: #fff no-repeat; box-shadow: 0 1px 3px rgba(0,0,0,.3);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--c); }
  .mapbox .dot.me { background: var(--me); color: #fff; border-color: #fff; }
  #mapview { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 50; }
  #mapview .panel { background: var(--paper); border-radius: 14px; padding: 14px 18px; width: min(900px, 94vw); max-height: 92vh; overflow-y: auto; }
  #mapview .mapbox .dot { width: 52px; height: 52px; font-size: 18px; border-width: 3px; }
  #mapview ul { font-size: 14px; line-height: 1.7; padding-left: 1.2em; }
  /* 饮食与身体分析 */
  .hbtn { font-size: 13px; margin-top: 8px; }
  .health { margin-top: 10px; padding: 10px 14px; border-radius: 10px; background: var(--bg); border: 1px dashed var(--line); font-size: 15px; }
  .health h4 { margin: 10px 0 2px; color: var(--me); font-size: 15px; }
  .health h4:first-child { margin-top: 0; }
  .health ul { margin: 2px 0; padding-left: 1.4em; }
  .health p { margin: 2px 0; }
  #stage .go { font-size: 14px; padding: 3px 14px; top: 12px; right: 12px; }
  /* 切换图片的按钮：竖着排在右边，只显示图标，鼠标停上去才展开文字（向左展开，不挡脸） */
  #stage .modes { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; z-index: 2; }
  #stage .modes .go { position: static; font-size: 16px; padding: 4px 8px; display: flex; align-items: center; gap: 6px; }
  #stage .modes .go .lb { display: none; font-size: 13px; white-space: nowrap; }
  #stage .modes .go:hover .lb { display: inline; }
  #stage .modes .go.on { background: var(--me); color: #fff; }
  /* 全身立绘：整个人都放进卡片里，从头到脚 */
  #stage.fullmode, #stage.fullmode.tall { background-color: #fff; background-size: contain; background-position: 50% 0; }
  /* 动态证件照：盖在大立绘上循环播放（静音） */
  #stage .idvid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: 50% 50%; background: #fff; border-radius: inherit; pointer-events: none; }
  #stage .info, #stage .go, #stage .modes { z-index: 2; }
  #stage .dtl { position: absolute; left: 12px; top: 12px; z-index: 3; width: 46px; height: 46px; padding: 0; display: grid; place-items: center; line-height: 1; border-radius: 50%; border: 2px solid var(--c); background: rgba(255,255,255,.9); font-size: 22px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.25); transition: transform .15s; }
  @media (hover: hover) { #stage .dtl:hover { transform: scale(1.1); } }
  /* 战损、易感期半身像：铺满整个框，下面不留白边 */
  #stage.covermode, #stage.covermode.tall { background-color: #fff; background-size: cover; background-position: 50% 0; }
  #stage.threemode, #stage.threemode.tall { background-color: #fff; background-size: contain; background-position: 50% 45%; }
  /* 兽形图是横版整只动物：放大到宽度的 1.7 倍，动物大致铺满卡片宽度，避开底部的文字 */
  #stage.beastmode { background-size: 170% auto; background-position: 50% 38%; }
  /* 竖版图（全身立绘）：按高度铺满；小图放大到上半身 */
  #stage.tall { background-size: cover; background-position: 50% 0; }
  #stage.beastmode.tall { background-size: auto 100%; background-position: 50% 0; }
  #thumbs .card.onstage { opacity: .45; }
  #thumbs .card.dragging { opacity: .3; }
  #thumbs .card.dropto { outline: 3px dashed var(--me); outline-offset: 2px; }
  #thumbs .card { cursor: grab; }
  #thumbs .card.tall { background-size: 140% auto; background-position: 50% 6%; }
  #thumbs .card.idpic { background-size: 100% auto; background-position: 50% 36%; }
  .card.noimg { background: var(--bg); display: flex; align-items: center; justify-content: center;
    font: 700 48px "STKaiti", "KaiTi", serif; color: var(--c); }
  .card.speaking { border-color: var(--c); box-shadow: 0 0 0 2px var(--c), 0 0 18px var(--c); }
  .card .info {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 10px 8px; color: #fff;
    background: linear-gradient(transparent, rgba(20, 12, 8, .78)); font-size: 12px; line-height: 1.5;
  }
  .card .nm { font: 700 18px "STKaiti", "KaiTi", serif; }
  .card .lv { display: block; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 1100px) { #cast { width: 300px; } }
  .card .bar { height: 4px; background: rgba(255,255,255,.25); border-radius: 2px; margin: 4px 0 3px; }
  .card .bar i { display: block; height: 100%; border-radius: 2px; background: var(--c); }
  .card .bar.fav { background-image:linear-gradient(90deg,transparent calc(50% - 1px),rgba(0,0,0,.28) calc(50% - 1px),rgba(0,0,0,.28) calc(50% + 1px),transparent calc(50% + 1px)); }
  .card .go {
    position: absolute; top: 8px; right: 8px; font-size: 12px; padding: 1px 10px;
    background: rgba(255,255,255,.85); color: #3b2f25; border: none;
  }
  @media (max-width: 900px) { #cast { display: none; } }
  .act { color: var(--muted); font-style: italic; }
  .think { color: #4f6a96; font-style: italic; }
  .env { color: var(--muted); font-size: 13px; text-align: center; margin: 10px 0 2px; }
  .sum { margin: 18px 0 4px; padding: 12px 18px 14px; border-radius: 14px; background: linear-gradient(135deg, #fffaf0, #fbefd6); border: 1px solid #e8c98f;
    box-shadow: 0 4px 14px rgba(160,110,40,.12), inset 0 1px 0 #fff; font-size: 14.5px; line-height: 1.8; color: #5a4632; }
  .sumh { display: flex; align-items: center; gap: 10px; font: 700 13px "STKaiti","KaiTi",serif; letter-spacing: 5px; color: #b07a2a; margin-bottom: 4px; }
  .sumh::before, .sumh::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #e0b46a); }
  .sumh::after { background: linear-gradient(90deg, #e0b46a, transparent); }
  .narr { opacity: .85; }
  .err { color: #c0392b; }
  .typing { color: var(--muted); font-size: 14px; }
  .tick { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 6px 12px; padding-left: 8px; border-left: 2px solid var(--muted); opacity: .8; }
  .typing::after { content: "…"; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .intro { color: var(--muted); text-align: center; padding: 30px 10px; }
  .intro b { color: var(--ink); }

  /* 手机竖屏：上面立绘，下面聊天；地图收成一行（日期天气），点开看大地图 */
  @media (max-width: 900px) {
    html, body { height: 100dvh; }
    header { padding: 6px 10px; gap: 8px; }
    header h1 { font-size: 16px; letter-spacing: 2px; }
    .tabs { overflow-x: auto; flex-wrap: nowrap; min-width: 0; scrollbar-width: none; }
    #reset { flex: none; padding: 4px 8px; }
    body { overflow-x: hidden; }
    .tab { white-space: nowrap; padding: 4px 8px; }
    #view-chat.on { flex-direction: column; }
    .chatcol { min-height: 0; }
    #cast { display: flex; flex: none; order: -1; width: auto; padding: 8px 10px; gap: 6px; border-left: none; border-bottom: 1px solid var(--line); }
    #stage { flex: none; height: 36vh; min-height: 0; }
    #stage .nm { font-size: 22px; }
    #stage .info { padding: 30px 12px 10px; font-size: 13px; }
    #stage .modes .go { font-size: 14px; padding: 2px 6px; }
    #minimap { padding: 4px 8px; }
    #minimap .mapbox, #minimap .mlog, #minimap .mbody, #mefood { display: none; }
    #minimap .mhead { margin: 0; font-size: 12px; white-space: nowrap; }
    #minimap .mhead span:last-child { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #thumbs { flex-wrap: nowrap; overflow-x: auto; min-height: 0; }
    #thumbs .card { flex: 0 0 56px; }
    #thumbs .card .info { display: none; }
    .scroll { padding: 12px 10px 6px; }
    .who { width: 60px; }
    .av { width: 56px; height: 56px; border-width: 2px; font-size: 22px; }
    .speaker { gap: 8px; }
    .speaker .name { font-size: 14px; }
    .ai { padding: 10px 12px; }
    .composer { padding: 8px 10px 10px; }
    textarea { font-size: 16px; }
  }

  /* 输入区 */
  footer, .composer { border-top: 1px solid var(--line); background: var(--paper); padding: 10px 16px 14px; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  button {
    font: inherit; font-size: 14px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: stretch; }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; height: 64px;
  }
  textarea:focus { outline: 2px solid var(--me); outline-offset: -1px; }
  .primary { background: var(--me); color: var(--me-ink); border: none; border-radius: 10px; padding: 0 20px; font-size: 16px; }
  .primary:disabled { opacity: .5; cursor: default; }
  .clip { border-radius: 10px; padding: 0 12px; font-size: 18px; }
  .cont { border-radius: 10px; padding: 0 12px; font-size: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; gap: 1px; }
  .cont span { font-size: 11px; color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; display: flex; gap: 16px; flex-wrap: wrap; }
  .hint label { cursor: pointer; }
  .pending { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .pending:empty { display: none; }
  .pitem { position: relative; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 4px; font-size: 12px; max-width: 140px; }
  .pitem img { display: block; width: 64px; height: 64px; object-fit: cover; border-radius: 6px; }
  .pitem .x { position: absolute; top: -8px; right: -8px; padding: 0 6px; font-size: 12px; line-height: 18px; }
  .dropping { outline: 3px dashed var(--me); outline-offset: -6px; }

  /* 日记 */
  .day { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; margin-bottom: 16px; }
  .day h3 { margin: 0 0 6px; font-family: "STKaiti", "KaiTi", serif; font-size: 18px; }
  .day h3 small { color: var(--muted); font-weight: normal; font-size: 13px; margin-left: 8px; }
  .entry { margin: 4px 0; white-space: pre-wrap; word-break: break-word; }
  .tm { color: var(--me); font-weight: 700; margin-right: 4px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  .dtabs { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--paper); justify-content: center; }
  .dtab { display: flex; align-items: center; gap: 6px; padding: 3px 14px 3px 3px; }
  .dtab.mine { padding: 4px 14px; }
  .dtab .mini { width: 30px; height: 30px; border-radius: 50%; background: var(--bg) no-repeat; border: 2px solid var(--c); }
  .dtab.on { background: var(--me); color: var(--me-ink); border-color: var(--me); }
  .hdhead { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .hdhead .nm { font: 700 26px "STKaiti", "KaiTi", serif; color: var(--c); }
  .hdhead .sub { color: var(--muted); font-size: 13px; }

<script>

window.favFill = (v, pos) => { v = Math.max(-100, Math.min(100, Number(v) || 0)); return v >= 0 ? `margin-left:50%;width:${v / 2}%${pos ? ';background:' + pos : ''}` : `margin-left:${50 + v / 2}%;width:${-v / 2}%;background:#7d63c8`; };
const $ = id => document.getElementById(id);

function esc(s) {

}
function fileUrl(root, p) { return root + p.split('/').map(encodeURIComponent).join('/'); }

/* ---------------- 附件 ---------------- */
function makeAttach(listEl) {
  const items = [];
  function draw() {
    listEl.innerHTML = '';
    items.forEach((f, i) => {
      const d = document.createElement('div');
      d.className = 'pitem';
      d.innerHTML = f.type.startsWith('image/')
        ? `<img src="${URL.createObjectURL(f)}" alt="">`
        : `📄 ${esc(f.name)}`;
      const x = document.createElement('button');
      x.className = 'x'; x.textContent = '×';
      x.onclick = () => { items.splice(i, 1); draw(); };
      d.appendChild(x);
      listEl.appendChild(d);
    });
  }
  return {
    add(files) { for (const f of files) items.push(f); draw(); },
    take() { const out = items.splice(0); draw(); return out; },
    get count() { return items.length; },
  };
}
function toPayload(files) {
  return Promise.all(files.map(f => new Promise((ok, fail) => {
    const r = new FileReader();
    r.onload = () => ok({ name: f.name || 'paste.png', type: f.type, data: r.result.split(',')[1] });
    r.onerror = fail;
    r.readAsDataURL(f);
  })));
}
function hookAttach(attach, clipBtn, textarea, dropZone) {
  clipBtn.onclick = () => {
    const p = $('picker');
    p.value = '';
    p.onchange = () => attach.add(p.files);
    p.click();
  };
  textarea.addEventListener('paste', e => {
    const files = [...(e.clipboardData?.files || [])];
    if (files.length) { e.preventDefault(); attach.add(files); }
  });
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dropping'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dropping'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('dropping');
    attach.add(e.dataTransfer.files);
  });
}

/* ---------------- 兽夫立绘 ---------------- */
let cast = {};
// 头像：从 16:9 的立绘里裁出脸。脸大约在图片宽 49%、高 27% 的位置
const AV = 122, ZOOM = 6, FACE_X = 0.49, FACE_Y = 0.30, RATIO = 9 / 16; // AV = 头像内部尺寸（128 减去边框）
function faceStyle(name, size, zoom = ZOOM) {
  const p = cast[name];
  if (!p || !(p.idImg || p.halfImg || p.img)) return '';
  // 头像优先从证件照裁（纯正面、构图统一），其次半身图；位置在 立绘/头像位置.json 的「名字-证件照」「名字-半身」
  const f = p.idImg ? (p.idFace || { x: 0.5, y: 0.43, z: 1.33, r: 1.5 })
    : p.halfImg ? (p.halfFace || { x: 0.5, y: 0.33, z: 2.2, r: 4 / 3 }) : (p.face || {});
  const src = p.idImg || p.halfImg || p.img;
  // r = 图片高÷宽，z = 放大倍数；横版老图没写就用默认值
  const fx = f.x ?? FACE_X, fy = f.y ?? FACE_Y, ratio = f.r ?? RATIO;
  const w = size * (f.z ?? zoom), x = size / 2 - fx * w, y = size / 2 - fy * w * ratio;
  return `background-image:url('${fileUrl('/game/', src)}');background-size:${w}px auto;background-position:${x}px ${y}px`;
}
function avatar(name) {
  // 头像按屏幕上实际的大小裁（手机上 .av 小很多，还按电脑的尺寸裁，脸就跑出框了）
  const st = faceStyle(name, innerWidth <= 760 ? 42 : innerWidth <= 900 ? 52 : AV);
  return st ? `<div class="av" style="${st}"></div>` : `<div class="av">${esc(name[0])}</div>`;
}
// 右侧：正在说话的兽夫显示大立绘，其他人是下面的小图
let castOrder = [], onStage = null, speaking = new Set(), viewMode = new Map();
// 大立绘可以切换看哪张图：证件照（默认，每人一张对齐好的标准脸）/ 全身 / 三视图 / 兽形；小图和头像也用证件照
const VIEWS = [['id', '🪪 证件照', 'idImg'], ['full', '🧍 全身', 'img'], ['three', '📐 三视图', 'threeImg'], ['beast', '🐾 兽形', 'beastImg'],
  ['wreckHalf', '💀 战损', 'wreckHalfImg'], ['wreck', '☠️ 战损全身', 'wreckImg'],
  ['feverHalf', '🔥 易感期', 'feverHalfImg'], ['fever', '❤️‍🔥 易感期全身', 'feverImg']];
// 状态.md 里他「此刻在做什么」写着【战损】/【易感期】时，大立绘默认换成对应的半身像（她手动选过就听她的）
function autoView(r) {
  if (/【易感期】/.test(r.doing || '') && r.feverHalfImg) return 'feverHalf';
  if (/【战损】/.test(r.doing || '') && r.wreckHalfImg) return 'wreckHalf';
  return '';
}
function shownImg(r, id) {
  if (id === 'stage') {
    const v = VIEWS.find(v => v[0] === (viewMode.get(r.name) || autoView(r)));
    if (v && r[v[2]]) return r[v[2]];
  }
  return r.idImg || r.halfImg || r.img;
}
function cardHtml(r, id) {
  const c = COLORS[r.name] || 'var(--c-other)';
  const img = shownImg(r, id);
  const bg = img ? `background-image:url('${fileUrl('/game/', img)}')` : '';
  const mode = id === 'stage' ? (VIEWS.find(v => r[v[2]] && img === r[v[2]]) || [''])[0] : '';
  const cls = ['card', img ? '' : 'noimg', speaking.has(r.name) ? 'speaking' : '', mode === 'beast' ? 'beastmode' : '', ['full', 'id', 'wreck', 'fever'].includes(mode) ? 'fullmode' : ['wreckHalf', 'feverHalf'].includes(mode) ? 'covermode' : '', mode === 'three' ? 'threemode' : '', id !== 'stage' && img && img === r.idImg ? 'idpic' : (r.face?.r > 1 ? 'tall' : '')].join(' ');
  // 大立绘左上角：有哪几种图就显示哪几个按钮，当前这张高亮
  const avail = id === 'stage' ? VIEWS.filter(v => r[v[2]]) : [];

      ${id === 'stage' && r.food ? (() => { const hv = +((r.food.nutrition || '').match(/健康值\s*(\d+)/) || [])[1]; const tip = [r.food.nutrition, r.food.body, r.food.sleep && '睡眠：' + r.food.sleep, r.food.exercise && '运动：' + r.food.exercise].filter(Boolean).join(' / ');

      ${r.food ? `<div class="doing food">🍖 ${esc(r.food.meals || '')}<br>🩺 ${esc(r.food.nutrition || '')}${r.food.body ? '；' + esc(r.food.body) : ''}${r.food.sleep && r.food.sleep !== '—' ? '<br>😴 ' + esc(r.food.sleep) : ''}${r.food.exercise && r.food.exercise !== '—' ? '<br>🏃 ' + esc(r.food.exercise) : ''}</div>` : ''}
    </div>

/* ---------------- 小地图 ---------------- */
// 地点在地图上的位置（百分比）。名字要和 CLAUDE.md「在哪」一节的地点一字不差
const PLACES = {

let mapInfo = {};
function mapPins(big) {

// 院子：大场景就是院子图（她的小屋在院子里），家具摆法来自「🏠 小屋」页（/api/room 的 yard），人用 Q 版小人站在各自的位置
const ROOM_W = { 她的床: 30, 草垛: 24, 木床: 27, 石桌: 24, 石凳: 18, 火塘: 21, 熏肉架: 23, 石槽: 22, 狼皮地毯: 27, 木箱: 16, 传送小箱子: 12, 陶水罐: 10, 柴堆: 18 };

const list = $('list'), log = $('log'), input = $('input'), sendBtn = $('send');

function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\*([^*\n]+?)\*/g, '<i class="think">$1</i>')
    .replace(/(（[^（）]*）|\([^()]*\))/g, '<span class="act">$1</span>')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\n/g, '<br>');
}
function render(text) {
  const out = [];
  for (const raw of text.split(/\n\s*\n/)) {
    const p = raw.trim();
    if (!p) continue;
    const m = p.match(/^\*{0,2}【([^】]+)】\*{0,2}\s*([\s\S]*)$/);
    if (m) {
      const c = COLORS[m[1]] || 'var(--c-other)';
      out.push(`<div class="speaker" style="--c:${c}"><div class="who">${avatar(m[1])}<div class="name">${esc(m[1])}</div></div><div class="text">${inline(m[2])}</div></div>`);
    } else if (/^📌/.test(p)) {
      out.push(`<div class="sum"><div class="sumh">本轮小结</div>${inline(p.replace(/^📌\s*(小结[：:])?\s*/, ''))}</div>`);
    } else if (/^`?——/.test(p)) {
      out.push(`<div class="env">${inline(p.replace(/`/g, ''))}</div>`);
    } else {
      out.push(`<div class="para narr">${inline(p)}</div>`);
    }
  }
  return out.join('');
}
// 用户消息里的 [图片：app/uploads/x.png] / [文件：...] 显示成图片或链接
function renderMine(text) {
  return esc(text).replace(/\[(图片|文件)：([^\]]+)\]/g, (_, kind, p) => {
    const u = fileUrl('/game/', p);
    return kind === '图片'
      ? `<img src="${u}" alt="">`
      : `<a class="filechip" href="${u}" target="_blank">📄 ${esc(p.split('/').pop())}</a>`;
  });
}
function addMe(text) {
  const d = document.createElement('div');
  d.className = 'msg me';
  d.innerHTML = `<div class="bubble">${renderMine(text)}</div>`;
  list.appendChild(d);
}
function addAi(text) {

}
// 一条聊天记录：整点小字动态 / 我说的 / 兽夫们的回复
function addMsg(m) {

  else if (!h.some(m => m.role === 'user' || (m.role === 'ai' && !m.tick && !m.sim))) send('🎬 开场', true);

async function waitForReply(box) {
  sendBtn.disabled = true;
  const s0 = await fetch('/api/status').then(r => r.json()).catch(() => ({}));
  box.innerHTML = s0.simming
    ? '<div class="typing">整点到了，兽夫们正在过这一个小时，过完就能接着聊</div>'
    : '<div class="typing">兽夫们还在回你上一句话</div>';
  scroll();
  while (true) {
    await new Promise(r => setTimeout(r, 3000));
    const s = await fetch('/api/status').then(r => r.json()).catch(() => ({ busy: true }));
    if (!s.busy) break;
  }
  sendBtn.disabled = false;
  await loadHistory();
}

async function send(preset, auto = false) {
  let text = (preset ?? input.value).trim();
  const files = preset ? [] : chatAttach.take();
  if ((!text && !files.length) || sendBtn.disabled) return;
  if (list.querySelector('.intro')) list.innerHTML = '';
  input.value = '';
  sendBtn.disabled = true;
  if (files.length) {
    try {
      const saved = await fetch('/api/upload', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ files: await toPayload(files) }),
      }).then(r => r.json());
      const marks = saved.map(s => `[${s.isImage ? '图片' : '文件'}：${s.path}]`).join('\n');
      text = text ? `${text}\n${marks}` : marks;
    } catch (e) {
      alert('文件发送失败：' + e.message);
      sendBtn.disabled = false;
      return;
    }
  }
  addMe(text);
  const box = addAi('');
  scroll(true);
  let reply = '';
  let wasBusy = false;
  try {
    const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, auto }) });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === 'delta') {
          reply += ev.text;
          box.innerHTML = render(reply);
          markSpeakers(reply);
          scroll();
        } else if (ev.type === 'reset' || ev.type === 'final') {
          reply = ev.text || '';
          box.innerHTML = reply ? render(reply) : '<div class="typing">兽夫们听到了你的声音</div>';
          markSpeakers(reply);
        } else if (ev.type === 'busy') {
          wasBusy = true;
        } else if (ev.type === 'error') {
          box.innerHTML = (reply ? render(reply) : '') + `<div class="para err">${esc(ev.text)}</div>`;
        }
      }
    }
  } catch (e) {
    box.innerHTML = `<div class="para err">连接断开了：${esc(e.message)}。请确认黑色的服务窗口还开着。</div>`;
  }
  if (wasBusy) {
    // 这句没发出去：放回输入框，先等上一句回完
    list.removeChild(box.previousElementSibling);
    input.value = auto ? '' : text;
    return waitForReply(box);
  }
  if (!reply && box.querySelector('.typing')) box.innerHTML = '<div class="para err">没有收到回复。</div>';
  // 回复后好感、心情可能变了，刷新兽夫栏
  loadCast().then(() => markSpeakers(reply));
  histLen = (await fetch('/api/history').then(r => r.json()).catch(() => [])).length || histLen;
  sendBtn.disabled = false;
  input.focus();
  scroll();
}
sendBtn.onclick = () => send();

const CN_NUM = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
function cnNum(n) {
  if (n <= 10) return CN_NUM[n];
  if (n < 20) return '十' + CN_NUM[n - 10];
  return CN_NUM[Math.floor(n / 10)] + '十' + (n % 10 ? CN_NUM[n % 10] : '');
}
function parseMyDay(text) {
  const days = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    const h = line.match(/^##\s+(.*)/);
    if (h) { days.push({ title: h[1], items: [] }); continue; }
    const it = line.match(/^\d+[.、]\s*(.*)/);
    if (it && days.length) {
      const [time = '', what = '', ...how] = it[1].split('｜');
      days[days.length - 1].items.push({ time: time.trim(), what: what.trim(), how: how.join('｜').trim() });
    }
  }
  return days;
}
async function loadMyDay() {
  const d = await fetch('/api/myday').then(r => r.json()).catch(() => ({}));
  const days = parseMyDay(d.text || '');
  if (!days.length) { $('mydays').innerHTML = '<div class="empty">还没有记录。你在游戏里做的每件事都会按顺序记在这里。</div>'; return; }
  $('mydays').innerHTML = days.map((day, i) => {
    const [, name, rest] = day.title.match(/^(第\S+?天)\s*(.*)$/) || [, day.title, ''];
    const items = day.items.map((x, k) => `<li><span class="no">第${cnNum(k + 1)}件</span><span class="tm">${esc(x.time)}</span><span class="what">${esc(x.what)}</span>${x.how ? `<span class="how">${inline(x.how)}</span>` : ''}</li>`).join('');
    return `<div class="day mday ${i === days.length - 1 ? 'today' : ''}"><h3>${esc(name)}<small>${esc(rest.replace(/[（）()]/g, ''))} · 共 ${day.items.length} 件</small></h3>
      ${items ? `<ol>${items}</ol>` : '<div class="empty">今天还没做什么。</div>'}</div>`;
  }).reverse().join('');
}
// 「物品与等级」：直接读 物品与等级.md，按「## 名字」分成卡片
async function loadItems() {
  if (!castOrder.length) await loadCast();
  const text = await fetch(fileUrl('/game/', '物品与等级.md') + '?t=' + Date.now()).then(r => r.ok ? r.text() : '').catch(() => '');
  const parts = text.split(/^## /m);
  if (parts.length < 2) { $('itemsBox').innerHTML = '<div class="empty">还没有记录。</div>'; return; }
  const cards = parts.slice(1).map(p => {
    const [title, ...body] = p.split(/\r?\n/);
    const name = title.trim();
    let rest = body.join('\n');
    const away = /【尚未登场】/.test(rest);
    rest = rest.replace(/^-\s*\*\*【尚未登场】\*\*\s*$/m, '');
    const isHusband = !!cast[name];
    const c = COLORS[name] || (name === '我' ? 'var(--me)' : 'var(--c-other)');
    const icon = isHusband ? `<div class="av" style="${faceStyle(name, 56)}"></div>` : `<div class="av" style="display:flex;align-items:center;justify-content:center;font-size:26px">${name === '我' ? '🌸' : '🏡'}</div>`;
    return { name, order: isHusband ? castOrder.indexOf(name) : 100 + (name === '我' ? 0 : 1),
      html: `<div class="day icard ${away ? 'away' : ''}" style="--c:${c}"><div class="ihead">${icon}<h3>${esc(name === '我' ? '我的东西' : name === '家里' ? '家里的东西' : name)}</h3>${away ? '<span class="tag">尚未登场</span>' : ''}</div>${md(rest)}</div>` };
  });
  // 已登场的兽夫排前面，按小图的顺序；然后是我、家里
  cards.sort((a, b) => a.order - b.order);
  $('itemsBox').innerHTML = cards.map(c => c.html).join('');
}
// 极简 Markdown：### 标题、- 列表、**粗体**
function md(text) {
  const out = [];
  let inList = false;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    const li = line.match(/^[-*]\s+(.*)/) || line.match(/^\d+[.、]\s*(.*)/);
    if (li) { if (!inList) { out.push('<ul>'); inList = true; } out.push(`<li>${inline(li[1])}</li>`); continue; }
    if (inList) { out.push('</ul>'); inList = false; }
    if (!line) continue;
    const h = line.match(/^#{1,6}\s+(.*)/);
    out.push(h ? `<h4>${inline(h[1])}</h4>` : `<p>${inline(line)}</p>`);
  }
  if (inList) out.push('</ul>');
  return out.join('');
}
/* ---------------- 切换页面 / 看大图 ---------------- */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + t.dataset.view));
  $('reset').style.visibility = t.dataset.view === 'chat' ? 'visible' : 'hidden';
  if (t.dataset.view === 'diary') loadDiary();
  else if (t.dataset.view === 'myday') loadMyDay();
  else if (t.dataset.view === 'items') loadItems();
  else input.focus();
});
document.addEventListener('click', e => {
  const go = e.target.closest('[data-goto]');
  if (go) { document.querySelector(`.tab[data-view="${go.dataset.goto}"]`).click(); return; }
  if (e.target.tagName === 'IMG' && e.target.closest('.bubble, .entry')) {
    $('viewer').querySelector('img').src = e.target.src;
    $('viewer').style.display = 'flex';
  }
});
$('viewer').onclick = () => { $('viewer').style.display = 'none'; };
