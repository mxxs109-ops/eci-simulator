<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <title>DeepSeek 开放平台：创建 API key 示意图</title>
  <rect width="760" height="400" fill="#f7f8fa"/>
  <rect x="0" y="0" width="760" height="40" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="22" cy="20" r="9" fill="#4d6bfe"/><text x="38" y="26" font-size="15" fill="#111" font-weight="700">deepseek 开放平台</text>
  <rect x="0" y="40" width="170" height="360" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="24" y="80" font-size="14" fill="#555">用量信息</text>
  <rect x="12" y="98" width="146" height="32" rx="6" fill="#eef2ff"/><text x="24" y="120" font-size="14" fill="#4d6bfe" font-weight="700">API keys</text>
  <text x="24" y="160" font-size="14" fill="#555">充值</text>
  <text x="24" y="196" font-size="14" fill="#555">接口文档</text>
  <text x="200" y="80" font-size="18" fill="#111" font-weight="700">API keys</text>
  <rect x="200" y="100" width="150" height="34" rx="6" fill="#4d6bfe"/><text x="222" y="122" font-size="14" fill="#fff">创建 API key</text>
  <rect x="200" y="150" width="530" height="90" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <text x="216" y="176" font-size="13" fill="#777">名称</text><text x="216" y="200" font-size="15" fill="#111">恶雌</text>
  <text x="380" y="176" font-size="13" fill="#777">key</text><text x="380" y="200" font-size="15" fill="#111">sk-3f9a••••••••••••••c21e</text>
  <rect x="640" y="184" width="70" height="28" rx="6" fill="#fff" stroke="#4d6bfe"/><text x="659" y="203" font-size="13" fill="#4d6bfe">复制</text>
  <g font-size="14" font-weight="700">
    <circle cx="160" cy="114" r="14" fill="#c0392b"/><text x="155" y="119" fill="#fff">3</text>
    <circle cx="360" cy="117" r="14" fill="#c0392b"/><text x="355" y="122" fill="#fff">3</text>
    <circle cx="722" cy="170" r="14" fill="#c0392b"/><text x="717" y="175" fill="#fff">4</text>
    <circle cx="160" cy="154" r="14" fill="#c0392b"/><text x="155" y="159" fill="#fff">2</text>
  </g>
  <text x="200" y="280" font-size="14" fill="#c0392b">② 先在「充值」里充一点钱　③ 点 API keys → 创建 API key</text>
  <text x="200" y="306" font-size="14" fill="#c0392b">④ 复制 sk- 开头的 key（只显示一次）</text>
  <text x="200" y="340" font-size="13" fill="#888">示意图，按官网布局画的；官网改版时以官网为准</text>
</svg>
